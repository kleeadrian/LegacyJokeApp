<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dad Joke Generator</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="wireframe">
      <section class="section" aria-labelledby="joke-heading">
        <h2 id="joke-heading">Joke</h2>
        <p id="setup" class="content" aria-live="polite">
          Click the button below for your first joke.
        </p>
        <button id="new-joke-btn" type="button">Tell me a joke</button>
      </section>

      <section class="section" aria-labelledby="punchline-heading">
        <h2 id="punchline-heading">Punchline</h2>
        <p id="punchline" class="content" aria-live="polite"></p>
      </section>

      <section class="section" aria-labelledby="rating-heading">
        <h2 id="rating-heading">Rating of the Joke</h2>
        <div
          id="rating-controls"
          class="rating-controls"
          role="radiogroup"
          aria-label="Rate this joke from 1 to 5"
        >
          <button type="button" class="rating-btn" data-rating="1" disabled>1</button>
          <button type="button" class="rating-btn" data-rating="2" disabled>2</button>
          <button type="button" class="rating-btn" data-rating="3" disabled>3</button>
          <button type="button" class="rating-btn" data-rating="4" disabled>4</button>
          <button type="button" class="rating-btn" data-rating="5" disabled>5</button>
        </div>
        <p id="rating-summary" class="content muted"></p>
      </section>

      <p id="status" class="status" role="status"></p>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
